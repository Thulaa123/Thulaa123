name: Refresh profile stats
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - scripts/requirements-stats.txt
      - assets/fonts/**
      - tests/test_update_stats.py
      - .github/workflows/profile-stats.yml
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Install font rendering dependencies
        run: |
          python3 -m venv .stats-venv
          .stats-venv/bin/python -m pip install -r scripts/requirements-stats.txt
      - name: Check card generation
        run: .stats-venv/bin/python -m unittest discover -s tests -v
      - name: Generate public GitHub stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: .stats-venv/bin/python scripts/update_stats.py
      - name: Commit refreshed cards
        run: |
          if git diff --quiet -- assets/stats; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats/overview.svg assets/stats/languages.svg
          git commit -m 'Refresh public GitHub stats'
          git pull --rebase origin main
          git push origin HEAD:main
